server:
  port: 8083
  servlet:
    context-path: /user-service
spring:
  application:
    name: user-service
  jpa:
    generate-ddl: true
    defer-datasource-initialization: true
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
      # any additional Hibernate properties can be added here
  datasource:
    url: jdbc:postgresql://localhost:5442/userdb
    username: test
    password: test
    driver-class-name: org.postgresql.Driver
  config:
    import:
      - classpath:platform-shared-properties.yaml
      - classpath:kafka-properties.yaml

security:
  jwt:
    publicKeyPath: classpath:keys/public_key.pem
    private-key-path: classpath:keys/private_key.pem
    issuer: user-service
    expiration-seconds: 3600

wmp:
  bootstrap:
    # first platform run: users created at startup if missing; profiler-service makes them PLATFORM_ADMIN.
    # At least two: with four-eyes approval one platform admin alone can't create a bank admin.
    platform-admins: ${WMP_BOOTSTRAP_PLATFORM_ADMINS:platform-admin-1@wmp.local,platform-admin-2@wmp.local}
