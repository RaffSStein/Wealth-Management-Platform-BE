kafka:
  topics:
    profiler-service:
      domain: profiler-service
      # produced topics
      role-assignment-granted:
        name: "${kafka.broker.environment}.${kafka.broker.tenant}.${kafka.topics.profiler-service.domain}.role-assignment-granted"
      role-assignment-revoked:
        name: "${kafka.broker.environment}.${kafka.broker.tenant}.${kafka.topics.profiler-service.domain}.role-assignment-revoked"
    # consumed topics
    user-service:
      domain: user-service
      user-created:
        enabled: true
        name: "${kafka.broker.environment}.${kafka.broker.tenant}.${kafka.topics.user-service.domain}.user-created"
        groupId: "${kafka.broker.environment}.${kafka.broker.tenant}.t.${spring.application.name}.user-created.sa.${kafka.broker.serviceAccount}"
      user-updated:
        enabled: false
        name: "${kafka.broker.environment}.${kafka.broker.tenant}.${kafka.topics.user-service.domain}.user-updated"
        groupId: "${kafka.broker.environment}.${kafka.broker.tenant}.t.${spring.application.name}.user-updated.sa.${kafka.broker.serviceAccount}"