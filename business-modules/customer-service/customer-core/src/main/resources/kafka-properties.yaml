kafka:
  topics:
    customer-service:
      domain: customer-service
      # produced topics
      customer-onboarded:
        # in case of customer service, this topic is also consumed
        consuming-enabled: true
        name: "${kafka.broker.environment}.${kafka.broker.tenant}.${kafka.topics.customer-service.domain}.customer-onboarded"
        groupId: "${kafka.broker.environment}.${kafka.broker.tenant}.t.${spring.application.name}.customer-onboarded.sa.${kafka.broker.serviceAccount}"
      customer-created:
        # in case of customer service, this topic is also consumed
        consuming-enabled: true
        name: "${kafka.broker.environment}.${kafka.broker.tenant}.${kafka.topics.customer-service.domain}.customer-created"
        groupId: "${kafka.broker.environment}.${kafka.broker.tenant}.t.${spring.application.name}.customer-created.sa.${kafka.broker.serviceAccount}"
      customer-rejected:
        # in case of customer service, this topic is also consumed
        consuming-enabled: true
        name: "${kafka.broker.environment}.${kafka.broker.tenant}.${kafka.topics.customer-service.domain}.customer-rejected"
        groupId: "${kafka.broker.environment}.${kafka.broker.tenant}.t.${spring.application.name}.customer-rejected.sa.${kafka.broker.serviceAccount}"
    user-service:
      domain: user-service
      # produced topics: a command to user-service, when an advisor creates a client
      create-user:
        name: "${kafka.broker.environment}.${kafka.broker.tenant}.${kafka.topics.user-service.domain}.create-user"
    profiler-service:
      domain: profiler-service
      # consumed topics: the CUSTOMER role assignments link and unlink customer records
      role-assignment-granted:
        enabled: true
        name: "${kafka.broker.environment}.${kafka.broker.tenant}.${kafka.topics.profiler-service.domain}.role-assignment-granted"
        groupId: "${kafka.broker.environment}.${kafka.broker.tenant}.t.${spring.application.name}.role-assignment-granted.sa.${kafka.broker.serviceAccount}"
      role-assignment-revoked:
        enabled: true
        name: "${kafka.broker.environment}.${kafka.broker.tenant}.${kafka.topics.profiler-service.domain}.role-assignment-revoked"
        groupId: "${kafka.broker.environment}.${kafka.broker.tenant}.t.${spring.application.name}.role-assignment-revoked.sa.${kafka.broker.serviceAccount}"
    # consumed topics
    document:
      domain: document-service
      file-validated:
        enabled: true
        name: "${kafka.broker.environment}.${kafka.broker.tenant}.${kafka.topics.customer-service.document.domain}.file-validated"
        groupId: "${kafka.broker.environment}.${kafka.broker.tenant}.t.${spring.application.name}.file-validated.sa.${kafka.broker.serviceAccount}"
