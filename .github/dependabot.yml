version: 2
updates:
  # Maven dependencies
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(dependencies): "
    labels:
      - "dependencies"
    # Libraries that are released together get one PR, so main never mixes their versions.
    # Only minor and patch updates are grouped: a major update gets its own PR, to be reviewed by hand.
    # A dependency goes into the first group it matches.
    groups:
      # Spring, Hibernate, Jackson, Micrometer, Kafka, PostgreSQL... are not pinned in the root POM: they follow the
      # Spring Boot parent, so bumping the parent moves them all. Spring Cloud is in the same group because each
      # release train supports only some Boot versions and fails at startup otherwise (the smoke tests catch it).
      # A Boot minor whose Spring Cloud train is not released yet stays red: that is the signal to wait.
      spring-boot:
        patterns:
          - "org.springframework.boot*"
          - "org.springframework.cloud*"
        update-types: [ "minor", "patch" ]
      # Code generators: a new version can change the generated API/model classes in every module
      openapi:
        patterns:
          - "org.openapitools*"
          - "io.openapiprocessor*"
        update-types: [ "minor", "patch" ]
      # Everything else: all patch updates in one PR
      other-patch:
        patterns:
          - "*"
        update-types: [ "patch" ]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(actions): "
    labels:
      - "dependencies"
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types: [ "minor", "patch" ]
