# Builds and tests every Maven module on JDK 21 (Temurin), then runs the SonarQube Cloud quality gate.
# Also called by release.yml to test the merge commit before tagging it.

name: Maven Build & Test

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:
    inputs:
      ref:
        description: Commit to test
        type: string
        required: false

# TODO: add Copilot suggestion for code review

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Empty until the secret is added (and always on fork PRs): the Sonar step is then skipped
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0   # full history, so Sonar can tell new code from old

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # The key changes with any pom.xml, so a dependency change starts from a fresh cache
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # install runs the tests too (and JaCoCo writes target/site/jacoco/jacoco.xml per module)
      - name: Build and test
        run: ./mvnw -B -ntp clean install

      # Fails the job when the quality gate fails. Not run for release.yml (inputs.ref set):
      # that commit was already analysed by the push to main.
      - name: SonarQube Cloud analysis and quality gate
        if: env.SONAR_TOKEN != '' && inputs.ref == ''
        run: ./mvnw -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.qualitygate.wait=true
